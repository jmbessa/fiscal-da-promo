# ESTE WORKFLOW NÃO É MAIS A PRODUÇÃO (fase 5I, 2026-08-28).
#
# Quem publica agora é a MÁQUINA DO DONO, pelo Agendador de Tarefas do Windows
# (deploy/agendar-windows.ps1; runbook em docs/runbooks/producao-windows.md).
# Aqui sobrou só o `workflow_dispatch`: FALLBACK MANUAL, para o dia em que a
# máquina cair. O `schedule:` foi REMOVIDO — não comentado, removido.
#
# Os três fatos MEDIDOS que forçaram a mudança:
#
#  1. O agendador do GitHub não entrega. Consulta à API do GitHub em
#     2026-08-28: em ~25 h de elegibilidade na branch padrão e ~16 disparos
#     esperados, este workflow teve UM run em toda a história do repositório
#     (`33115325845`, 2026-08-27T20:51Z) — e ele saiu 51 min atrasado. O
#     `tests.yml` rodava normalmente no mesmo período: não é billing nem
#     permissão, é o agendador. O GitHub documenta que o evento `schedule`
#     atrasa em carga alta e que disparo atrasado além do intervalo é
#     DESCARTADO. A fase 5G moveu o cron do minuto 0 para o 7 como mitigação —
#     mitigação DOCUMENTADA, nunca COMPROVADA.
#  2. Story com figurinha de link não pode rodar aqui. IP de datacenter que
#     muda a cada execução é o padrão que mais dispara `challenge_required`, e
#     não existe figurinha pela API oficial (a Graph API não suporta sticker em
#     story). O próprio código recusa: `AVISO_STORY_LINK_FORA_DO_RUN`.
#  3. A máquina do dono é um host viável, e isso foi MEDIDO em 2026-08-28:
#     48,7 h de uptime contínuo, plano de energia "Ultimate Performance" e
#     suspensão em corrente alternada = 0 (nunca suspende).
#
# POSTO DUPLO — por que o gatilho automático teve de MORRER, e não só "ficar de
# reserva": os dois hosts têm `state.db` SEPARADOS, e é o `state.db` que guarda
# o dedupe. Com a máquina publicando, um disparo agendado daqui publicaria a
# MESMA oferta uma segunda vez.
#
# A ORDEM DA VIRADA (está no runbook, e importa): primeiro criar as tarefas e
# ver um run REAL acontecer; só então desligar este `schedule:`. Invertido,
# fica um intervalo sem ninguém publicando.
#
# QUEM VIGIA A MÁQUINA agora: o aviso de cadência da 5G
# (`schedule.max_gap_minutes`, hoje 40 min para a cadência de 15) no resumo que
# já vai ao chat de operações, e o `afiliado doctor`, que passou a conferir se
# as duas tarefas do Agendador existem e estão habilitadas.
#
# USAR O FALLBACK: aba Actions → publish → Run workflow (com opção dry-run).
# Ele publica de verdade e COMMITA o `data/state.db` do runner — que diverge do
# banco da máquina do dono. Antes de devolver a produção à máquina, leia
# "Como voltar para o Actions" em docs/runbooks/producao-windows.md.
# `--posts-per-run 5` continua aqui de propósito: um disparo de emergência
# precisa publicar o orçamento ACUMULADO, não a fatia de 15 min da máquina.
#
# Tamanho do state.db commitado — MEDIDO na 5G e ainda válido para os disparos
# manuais. Com o volume real da descoberta, o arquivo em regime ficava em
# ~78 MB a 32 runs/dia (29,8 de `candidates` + 47,7 de `price_log`) e ~174 MB
# na cadência de 5 min da VPS; e o histórico do git cresce só
# **0,375 MB por commit** — o git não guarda o binário inteiro a cada vez.
# Como o agendamento morreu, esta entrada praticamente parou: o que cresce
# agora é o banco LOCAL da máquina do dono, que não é commitado. Alavancas e
# contas em docs/runbooks/vps-setup.md.
name: publish
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run (não publica)"
        type: boolean
        default: false
# Dois runs simultâneos furariam o teto e o dedupe: o segundo espera.
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
env:
  # Pin: `npm install -g @anthropic-ai/claude-code` sem versão instalava o que
  # estivesse publicado no dia, com todos os segredos no ambiente.
  CLAUDE_CODE_VERSION: "2.1.246"
jobs:
  run:
    runs-on: ubuntu-latest
    # Sem isto vale o padrão do GitHub: 6 h. Um run em martelo contra a API da
    # loja (backoff de 0,5+1,5+4,0 s em cada chamada) queimaria 360 min — 18%
    # da cota mensal — antes de alguém perceber. Um run saudável leva minutos.
    timeout-minutes: 20
    steps:
      - name: Marcar o início do job
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache do Claude Code (npm global)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-claude-code-${{ env.CLAUDE_CODE_VERSION }}
      - run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }} --prefer-offline
      - run: pip install -e .
      - name: Executar pipeline
        run: afiliado run --posts-per-run 5 ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          ART_HOST_BOT_TOKEN: ${{ secrets.ART_HOST_BOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Verificado ao vivo em 2026-08-26: `/products/{id}/items` ACEITA o
          # token de aplicação (client_credentials, HTTP 200 em 3 produtos do
          # pool). O `MeliSource` tenta client_credentials primeiro, então no
          # runner efêmero ele NUNCA rotaciona refresh_token e não há nada a
          # gravar de volta em secret. MELI_REFRESH_TOKEN fica só como rede de
          # segurança; se um dia o client_credentials for recusado, ver
          # "Token do ML no runner efêmero" em docs/runbooks/meli-setup.md.
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
      # Fase 5D (F1): o `afiliado feed` existia e ninguém o executava — o
      # carrossel do termômetro era gesto manual do dono. Ele é DIÁRIO (o teto
      # de `channels.instagram_carrossel` é 1/dia).
      #
      # Fase 5I: este passo era o ÚNICO lugar que chamava `afiliado feed`.
      # Desligar o `schedule:` sem mais nada mataria o carrossel e o flagrante
      # em silêncio — por isso as duas peças ganharam tarefa PRÓPRIA no
      # Agendador do Windows (FiscalDaPromo-Feed e FiscalDaPromo-Flagrante, em
      # deploy/agendar-windows.ps1). Aqui elas ficam por completude do fallback
      # manual: um disparo à mão continua entregando o dia inteiro.
      #
      # Fase 5G (G2): o passo era `if: github.event.schedule == '0 11 * * *'`.
      # Com ~15 dos 16 disparos DESCARTADOS pelo agendador (medição no
      # cabeçalho), prender o feed a um slug de cron significa, na prática,
      # feed que nunca sai — e sai em silêncio, porque o passo é
      # `continue-on-error`. O freio passou para o CÓDIGO, onde os testes
      # alcançam: `_carrossel_pode_sair` (ritmo + teto de
      # `channels.instagram_carrossel`) e `_flagrante_pode_sair` (teto diário
      # em `day_flags`), ambos conferidos ANTES de qualquer descoberta.
      # O que isso compra, além de não depender do agendador: um run que falha
      # é repetido pelo disparo seguinte e a peça ainda sai no MESMO dia —
      # antes, uma falha às 08:00 era um dia inteiro sem feed. E o
      # `workflow_dispatch` passa a fazer feed, o que nunca fazia.
      # Custo: os dois comandos são invocados em todos os disparos; nos runs em
      # que a cota do dia já foi gasta ambos saem antes de qualquer chamada de
      # rede — ~1–2 s de startup do Python por disparo, e nada mais.
      #
      # As duas peças num passo só (um bloco de segredos, não três) e nenhuma
      # derrubando a outra: o shell é `bash -e` e o `||` é o que impede o
      # primeiro comando com saída != 0 de encerrar o resto.
      #
      # O flagrante NÃO publica: ele desenha o gráfico e manda ao chat de
      # operações esperando o "ok" do dono (`docs/feed.md`). Ele só pode ser
      # diário porque a rodada de fechamento lhe deu dedupe de 7 dias
      # (`day_flags`) — sem isso o mesmo produto voltaria toda manhã.
      - name: Conteúdo do feed
        # Um carrossel que falha não pode impedir o commit do `state.db` que o
        # `run` acabou de produzir: sem ele, o dedupe e o teto do próximo run
        # saem furados. O passo avisa e o job segue verde.
        continue-on-error: true
        run: |
          afiliado feed --tipo termometro || echo "::warning::carrossel do feed falhou"
          afiliado feed --tipo flagrante || echo "::warning::flagrante do feed falhou"
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          ART_HOST_BOT_TOKEN: ${{ secrets.ART_HOST_BOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
      - name: Commitar estado
        if: ${{ always() && !inputs.dry_run }}
        # `git push` sem `pull --rebase` PERDIA o estado do run anterior (dedupe
        # e teto furados). Em conflito no binário, o run ATUAL vence — e agora
        # vence de verdade: a versão anterior terminava em
        # `git rebase --continue || git rebase --skip`, e o `--skip` DESCARTA o
        # commit deste run, o oposto do que o comentário prometia. Aqui o
        # conflito é resolvido abortando o rebase, voltando exatamente ao que o
        # remoto tem (nada do que os outros commitaram se perde) e recolocando
        # por cima o `state.db` DESTE run.
        run: |
          set -euo pipefail
          git config user.name "afiliado-bot"
          git config user.email "afiliado-bot@users.noreply.github.com"
          # Primeiro run (ou run que morreu antes de abrir o banco): o arquivo
          # não existe, e `git add` de caminho inexistente FALHA o passo inteiro
          # com `set -e` — o run virava vermelho sem ter feito nada de errado.
          if [ ! -f data/state.db ]; then
            echo "data/state.db ainda não existe — nada a commitar"
            exit 0
          fi
          git add data/state.db
          if git diff --cached --quiet; then
            echo "estado inalterado — nada a commitar"
            exit 0
          fi
          git commit -m "chore: atualiza estado após run [skip ci]"
          ESTADO_DO_RUN="${RUNNER_TEMP:-/tmp}/state-do-run.db"
          for tentativa in 1 2 3; do
            if ! git pull --rebase --no-edit; then
              git rebase --abort || true
              cp data/state.db "$ESTADO_DO_RUN"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              cp "$ESTADO_DO_RUN" data/state.db
              git add data/state.db
              git commit -m "chore: atualiza estado após run [skip ci]"
              echo "::warning::conflito binário em data/state.db — o estado deste run venceu"
            fi
            if git push; then
              exit 0
            fi
            echo "push recusado (tentativa $tentativa) — refazendo o rebase"
          done
          echo "::error::não foi possível commitar data/state.db após 3 tentativas"
          exit 1
      - name: Duração do job
        if: always()
        # I-3: o GitHub cobra cada job arredondado para o minuto SEGUINTE, e a
        # duração deste nunca foi medida — a cota inteira da 5C saiu de um
        # "~1,5 min" chutado. Isto imprime a medição real e a joga no resumo do
        # run (aba Actions → o run → Summary). "Set up job" e "Complete job"
        # ficam fora dos passos e somam ~15 s: a estimativa já os inclui.
        # Sem `schedule:` a cota mensal deixou de ser um risco (só há disparo à
        # mão), mas o número continua valendo: é ele que diz quanto custaria
        # RELIGAR o agendamento, se um dia alguém quiser.
        # Registre a PRIMEIRA medição em docs/runbooks/producao-windows.md.
        run: |
          segundos=$(( $(date +%s) - JOB_START ))
          cobrados=$(( (segundos + 15 + 59) / 60 ))
          echo "duração dos passos: ${segundos}s · ~${cobrados} min cobrados"
          echo "job: ${segundos}s de passos → ~${cobrados} min cobrados (fallback manual; a produção roda na máquina do dono)" >> "$GITHUB_STEP_SUMMARY"
