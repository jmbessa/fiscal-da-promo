state:
  path: data/state.db
  # Fase 5F (I2): o `afiliado stories` roda na MÁQUINA DO DONO e escreve num
  # banco próprio. `data/state.db` acima é rastreado no git e o Actions o
  # commita a cada run — o comando local escrevendo nele faria todo `git pull`
  # virar conflito binário. Este arquivo está no .gitignore e é só dele.
  # O preço, para você saber: o dedupe e o histórico de preços do canal de
  # story com figurinha ficam INDEPENDENTES do resto — um produto que saiu no
  # Telegram de manhã pode virar story à tarde. São superfícies diferentes e
  # são 6 por dia; se um dia isso incomodar, aponte os dois para o mesmo
  # arquivo e aceite os conflitos.
  stories_path: data/state_stories.db

# Fase 5A: dia LOCAL e ritmo. O teto diário de cada canal, o price_log e a
# deduplicação de avisos são contados no dia deste fuso (antes era UTC: a
# fronteira caía às 21:00 BRT e o canal calava das 13:20 às 21:00). O teto é
# distribuído ao longo da janela: um canal só publica enquanto
# count_hoje < min(max_per_day, floor(max_per_day × fração_da_janela) + 1);
# fora da janela o orçamento é 0 (um run de madrugada não publica). A janela
# deve bater com deploy/afiliado.timer.
# A janela termina 23:15, e não 23:55, por causa do ritmo: o último disparo do
# Actions é 23:00 BRT e `pacing_budget` só devolve o teto INTEIRO no fim da
# janela — com 23:55 o orçamento das 23:00 era 59 e a meta de 60/dia era
# inalcançável por construção (menor da revisão da 5C). Ao mudar a cadência,
# refaça a conta: o último disparo precisa cair a ≤ 1/60 do fim da janela.
schedule:
  timezone: America/Sao_Paulo
  window_start: "08:00"
  window_end: "23:15"
  # Fase 5G (G3): a partir de quantos minutos SEM RUN o resumo que já vai ao
  # chat de operações acusa buraco na cadência (em horas, e com quantos
  # disparos se perderam). Medido em 2026-08-28: o workflow `publish` tinha
  # UM run em ~25 h e ~16 disparos esperados — o agendador do Actions
  # descartava o resto — e o pior não foi ele falhar, foi ninguém ter como
  # perceber.
  # Fase 5I: a produção passou para o Agendador de Tarefas do Windows, na
  # máquina do dono, a cada 15 min (deploy/agendar-windows.ps1). 40 porque a
  # cadência é de 15: tolera um disparo perdido (30 min) mais o atraso de uma
  # máquina ocupada e acusa a partir do segundo. Este aviso é hoje o SENSOR de
  # "a máquina parou" — se ele calar por horas, ninguém está publicando.
  # Só vale entre runs do MESMO dia local (das 23:03 às 08:03 há 9 h por
  # desenho) e nunca no primeiro run da vida. 0 desliga o aviso. Ao mudar a
  # cadência do agendador, mude este número junto —
  # tests/test_agendador_windows.py trava os dois.
  max_gap_minutes: 40

llm:
  model: haiku

# Fase 1.8: a cadência real de execução é definida pelo agendador externo
# (cron da VPS a cada 5 min, produção; ver docs/runbooks/vps-setup.md) — não
# há nada aqui que controle o intervalo entre runs.
selection:
  posts_per_run: 1
  price_min_brl: 20
  price_max_brl: 1000
  dedupe_days: 30
  # Fase 4/5B — régua honesta de preço. O desconto do vendedor (o "de" inflado)
  # deixou de decidir SE publicamos e passa a decidir só O QUE o post alega:
  # o corte de preço aqui é apenas não anunciar item mais caro que o típico.
  # Regra do quartil (5B): o post só alega desconto quando o preço de hoje
  # está ESTRITAMENTE abaixo do quartil mais barato da janela (preço < p25 —
  # um preço que ocupa 1/4 dos dias É o p25 e não é promoção), a janela tem
  # >= 14 dias distintos e o desconto contra a mediana atinge
  # min_real_discount_pct. O selo de menor preço é ESTRITO (preço <= mínima) e
  # diz a janela medida — a margem de 5% que existia aqui saiu.
  max_above_ref: 1.00          # não anuncia item mais caro que o preço típico
  require_price_ref: false     # true = só publica com referência conhecida
  min_real_discount_pct: 10    # abaixo disso o post não alega desconto: mostra preço + prova social
  ref_window_days: 90          # janela do histórico próprio de preços
  ref_min_observations: 14     # dias distintos mínimos para mediana/p25 valerem (regra do quartil)
  # Fase 1.8: piso de valor esperado (comissão em R$ ponderada por popularidade,
  # via ev_score, SEM boost de watchlist) por post — com dedupe de 30 dias e
  # cadência de 5 min (184 checagens/dia, 08:00–23:15), evita postar sobras
  # quando o estoque de boas ofertas esgota. 0 ou ausente desliga o piso (todas
  # as ofertas que passam os demais filtros seguem elegíveis).
  min_ev_brl: 0.50
  # Fase 5C (M2): fração do teto diário do Telegram (channels.telegram.max_per_day)
  # que cada loja deve ocupar. Normalizada entre as fontes LIGADAS — com o ML
  # desligado a Shopee fica com 100%, não com metade. Ao escolher a próxima
  # oferta da fila, o pipeline prefere as fontes ainda abaixo da meta do dia;
  # se nenhuma delas tem candidata, qualquer fonte serve (uma completa a
  # outra — a cota reparte o teto, nunca o deixa ocioso).
  source_quota: {shopee: 0.5, meli: 0.5}
  # Rodada de correção da 5C (C1): teto de descartes de UM run. Com o estoque
  # de candidatas, a fila de publicação é o estoque inteiro e cada descarte
  # custou uma chamada de `refresh_price`: uma API que começa a recusar produzia
  # 5.000 descartes e 5.000 chamadas num run só (medido), com 0,5+1,5+4,0 s de
  # backoff em cada 429 — horas martelando a conta de afiliado. Atingido o teto,
  # o run encerra com "⚠️ N descartes no run — fila interrompida". O outro freio
  # não é configurável: 10 erros de FONTE seguidos da mesma loja tiram aquela
  # loja da fila até o próximo run (pipeline.MAX_FALHAS_SEGUIDAS_POR_FONTE).
  # 0 desliga o teto — não faça isso com o estoque ligado.
  max_descartes_por_run: 50
  # Prioridade definida pela análise JoomPulse de 2026-08-23 (dados de jul/2026):
  # Beleza (100630, +12% m/m) e Casa (100636, maior volume) como núcleo;
  # Saúde (100001), Esportes (100637) e Mãe e Bebê (100632) como complemento.
  # Faixa de foco de impulso: R$25-150.
  # Fase 3: por fonte (dict) — a Shopee usa IDs numéricos e o ML usa IDs
  # "MLB...", então um allowlist único descartaria toda oferta de uma das
  # fontes. Lista simples (formato antigo) continua valendo para todas as
  # fontes; vazio/ausente = todas as categorias passam.
  category_ids:
    shopee: ["100630", "100636", "100001", "100637", "100632"]
    meli: []      # vazio: o pool curado (meli.offers_path) já vem pré-filtrado
  # Pesos do score de valor esperado (fase 1.5):
  #   EV = (comissão em R$ ** commission_exp) × (1 + popularity × log10(vendas+1))
  #        × (1 + discount × desconto_alegável/100)
  ev_weights:
    popularity: 0.3
    discount: 0.5     # bônus só por desconto que o VEREDITO autoriza alegar
    # Fase 5C (A8): a comissão entra amortecida. Crua, o fator dela variava 50x
    # (R$ 20 → R$ 1.000) contra 2,5x de popularidade e 1,5x de desconto, e o LLM
    # só via os 30 itens mais caros. Com 0.7, 8x de comissão viram 4,3x de EV.
    # 1.0 devolve o comportamento anterior.
    # O que o expoente NÃO faz (corrigido na revisão da 5C, I-4): ele não
    # inverte a câmera de R$ 800 a 3% com 100 vendas contra a creatina de R$ 30
    # a 10% com 50 mil vendas — 14,81 x 5,20, a câmera segue ganhando, só que
    # por 2,8x em vez de 5,3x. Ele move o CRUZAMENTO: contra essa creatina, um
    # item de 100 vendas precisava valer mais de R$ 4,51 de comissão e agora
    # precisa passar de R$ 5,38. A inversão aparece em pares próximos (R$ 12,50
    # com 90 mil vendas passa a ganhar de R$ 30,00 com 2 vendas). Quem leva o
    # campeão de vendas ao LLM é o recorte por vendas do slate, não isto aqui.
    # O EV deixa de ser "reais por post" e vira um score — min_ev_brl acima é
    # lido na MESMA escala (0,50 continua cortando comissão abaixo de ~R$ 0,38).
    commission_exp: 0.7

# Fase 3 (parte 1): fontes de ofertas habilitadas. Seção opcional — ausente,
# equivale a só shopee (comportamento de antes desta fase). O Mercado Livre
# nasce DESLIGADO: ligar exige credenciais (ver README) e o pool de links de
# afiliado (data/meli_links.json, ver docs/runbooks/meli-setup.md).
sources:
  shopee: true
  # DESLIGADO EM 2026-08-28 — o preço publicado estava muito acima do real, e a
  # causa não tem correção rápida. Dois casos medidos ao vivo, ambos no ar:
  #
  #   MLB19603205 (creatina): o anúncio gravado como vencedor do buy box NÃO
  #   está mais em /products/{id}/items. A oferta foi publicada mesmo assim,
  #   com R$ 80 — que é a MEDIANA do pool, não um preço vivo. Os anúncios reais
  #   custam de R$ 35,90 a R$ 39,90.
  #
  #   MLB22983247 (colchão): o anúncio gravado existe e custa R$ 209,87, mas o
  #   vencedor real está entre R$ 109 e R$ 119 (a página mostrava R$ 113).
  #
  # A raiz é a mesma dos dois: NÃO SABEMOS quem vence o buy box. O `buyBoxId`
  # do JoomPulse envelhece, e a API do ML não entrega o vencedor —
  # `buy_box_winner` vem nulo e o campo `tier` vem vazio nos 89 anúncios
  # sondados em 2026-08-28. Religar só depois de decidir qual preço publicar
  # quando o vencedor é desconhecido (ver docs/runbooks/meli-setup.md).
  meli: false

# Fase 5C (C1) — DESCOBERTA ROTATIVA. Tudo aqui vem da medição de 2026-08-26
# contra a API real (147 chamadas; docs/superpowers/reviews/2026-08-26-descoberta-shopee.md).
# O que ela mostrou: cada (categoria, sortType) é uma janela de 40 páginas × 50
# = 2.000 itens (`hasNextPage: false` na p40), 54,6% dos itens das raízes são
# elegíveis (≈ 5.460/mês, único motivo de corte: preço < R$ 20) e a p1 muda
# 1-2 itens em 50 a cada ~9 h. Ou seja: reler as mesmas 2 páginas a cada 5 min
# dava 244 itens únicos/mês (8 posts/dia a dedupe 30); ler UMA FATIA por run e
# acumular num estoque dá 60/dia com margem de 3x, sem afrouxar o dedupe.
shopee:
  sort_types: [2]           # 1 e 6 = mesmo conjunto; 3/4 = 0 elegíveis; 5 = 72% sem venda
  list_type: 0              # 1 e 2 = mesmo conjunto que 0; 3/4 exigem matchId
  page_size: 50             # máximo aceito pela API (limit=100 → erro 11001)
  pages: 40                 # janela real por listagem; o cursor volta à p1 no fim
  calls_per_run: 8          # 5 raízes + 2 subcategorias + 1 keyword: 128 chamadas/dia
                            # no Actions (16 runs), ~1.500 na VPS (192 runs). Cortar
                            # este número para <= 5 desliga subcategorias e keywords
                            # em silêncio — o run avisa quando isso acontece.
  candidate_max_age_days: 3 # por quantos dias a candidata descoberta segue na fila
  # Buscar POR categoria muda tudo: sem isso a API devolve majoritariamente a
  # categoria 100644 (fora da nossa lista). Medido em 2026-08-25: desconto médio
  # sobe de 19% para ~47% e a mediana de vendas de 282 para milhares.
  # Uma página de raiz por run, por categoria: as 5 janelas inteiras a cada 40
  # runs (~3h20).
  category_ids: ["100630", "100636", "100001", "100637", "100632"]
  # Subcategorias de nível 2: cada uma tem a SUA janela de 2.000, disjunta da
  # raiz nas páginas fundas (300/300 itens inéditos nas p10/p40 de 5 delas) —
  # mas a p1 é quase o topo da raiz (0-1 inédito em 50), por isso a rotação
  # começa na p2. As IDs são as que têm >= 25 itens no top-500 da própria raiz.
  subcategories_per_run: 2
  subcategory_first_page: 2
  subcategory_ids: [
    100663, 100659, 100662, 100664, 100658, 102002,                    # Beleza
    100716, 100717, 100711, 100715, 100710, 100709, 100721, 100718,    # Casa
    100018, 100002, 100019,                                            # Saúde
    100727, 100725, 100726, 100728,                                    # Esportes
    100684, 100678, 100675, 100679, 100683,                            # Mãe e Bebê
  ]
  # 40 termos × páginas 1-2 = 80 fatias, 1 por run. `keyword` funciona junto com
  # `productCatId` mas NÃO é filtro estrito (8% dos nós vêm de outra categoria):
  # quem descarta é o allowlist de selection.category_ids. Cada lista está
  # ordenada por elegíveis inéditos medidos; os últimos de cada linha renderam
  # 0-14 e são os primeiros a sair se a cota de chamadas apertar.
  keywords_per_run: 1
  keyword_pages: 2
  keywords:
    "100001": [creatina, whey, colágeno, massageador, vitamina, balança, termômetro, escova dental]
    "100630": [sérum, protetor solar, shampoo, perfume, depilador, batom, hidratante, maquiagem]
    "100636": [lixeira, panela, protetor colchão, mop, lençol, cortina, travesseiro, organizador]
    "100637": [halteres, legging, guarda chuva, camisa térmica, tênis, conjunto fitness, bicicleta, dry fit]
    "100632": [patinete, mamadeira, carrinho bebê, toalha umedecida, lençol berço, mordedor, brinquedo sensorial, fralda]

# Fase 3B: descoberta no Mercado Livre lê um pool curado (offers_path) em vez
# de buscar ao vivo — /sites/MLB/search e /items/{id} devolvem 403 na API real
# (ver docs/runbooks/meli-setup.md). O preço é atualizado ao vivo por item
# (/products/{id}/items) só imediatamente antes de publicar (refresh_price).
meli:
  offers_path: data/meli_offers.json   # pool curado; ver docs/runbooks/meli-setup.md
  links_path: data/meli_links.json     # pool de links de afiliado (gerado por /meli-links-refresh)
  # Comissão média estimada do programa de afiliados do ML, usada no cálculo de
  # valor esperado enquanto a API não expõe a taxa por item.
  # Ajuste com as taxas reais do seu painel de afiliados por categoria.
  commission_pct: 4.0
  # Fase 4: o ML não tem mais teto de preço próprio. Quem
  # decide publicabilidade é selection.max_above_ref + validate.check_price,
  # igual para as duas lojas; a mínima histórica do pool vira
  # Offer.price_floor_cents e só alimenta o selo de menor preço.
  tag: "jmbessa"             # etiqueta cadastrada no painel de afiliados (linkbuilder)

validation:
  # Fase 5A: o portão de link é OFFLINE — só confere https + host do próprio
  # link de afiliado (igual a um destes domínios ou subdomínio dele) + ausência
  # de espaço/caractere de controle. Nenhuma requisição ao link: um GET do
  # pipeline no link curto seria um clique de afiliado artificial (IP da VPS,
  # segundos após a geração) e contaminaria a atribuição.
  # mercadolivre.com.br e mercadolivre.com precisam estar os dois: a checagem
  # casa host == d ou host.endswith("." + d), e um não cobre o outro.
  allowed_domains: ["shopee.com.br", "shope.ee",
                    "mercadolivre.com.br", "mercadolivre.com", "meli.la"]

copy:
  tone: "empolgado, direto, sem exageros enganosos, pt-BR"

# Identidade: nome e handle desenhados nas artes de story/feed (ver docs/brand-guidelines.md).
brand:
  name: "Fiscal da Promo"
  handle: "@ofiscaldapromo"

# Fase 1.6: artefato semanal gerado por análise externa (boosts de EV + selo de menor preço).
# Opcional — ausente ou vencido, o pipeline degrada para o comportamento sem watchlist.
watchlist:
  path: data/watchlist.json

# Variante da API do Instagram usada por `instagram_feed`, `instagram_story`
# (fase 5E) e pelo doctor:
#   instagram_login — "API do Instagram com Login do Instagram": token gerado no painel
#                     da Meta, sem Página do Facebook (padrão; ver docs/runbooks/meta-setup.md)
#   facebook_login  — conta business vinculada a Página; token via Graph API Explorer
instagram:
  api: facebook_login

# Fase 2A/1.7: canais habilitados. Seção opcional — ausente, equivale a só
# telegram. Cada canal aceita bool (liga/desliga) ou dict com `enabled` e,
# opcionalmente, `max_per_day` (teto diário contado no SQLite no dia LOCAL e
# distribuído pela janela de `schedule:` — ver o ritmo lá; serve para não
# saturar canais de esforço manual ou com limites de API/audiência).
channels:
  telegram:
    enabled: true
    max_per_day: 60          # meta: 60 ofertas/dia, espalhadas das 08:00 às 23:15 (~1 a cada 15 min)
  # Fase 5E: DESLIGADO. Este canal só entrega a arte no chat de operações para
  # o dono postar à mão — 6 gestos por dia. Ele existia porque o projeto
  # acreditava que a API não publicava story; ela publica (medido ao vivo em
  # 2026-08-27, ver docs/runbooks/meta-setup.md) e quem faz isso agora é o
  # `instagram_story` abaixo. Continua aqui como FALLBACK MANUAL: se a conta
  # perder a permissão de publicação (instagram_content_publish), ligue este e
  # desligue o outro — o dia volta a sair, só que na mão.
  story_dispatch:
    enabled: false           # SEMI-automático: arte de story + link prontos no chat de operações; você posta
    max_per_day: 6           # artes de story por dia, ~uma a cada 2h40
  instagram_feed:
    enabled: true             # Variante B configurada em 2026-08-25 (token de Página permanente)
    max_per_day: 2           # 1 de manhã, a 2ª só a partir da metade da janela
  # Fase 5D: o CARROSSEL (`afiliado feed`, tipo termometro). Publica pelo mesmo
  # canal e pela mesma cota da Meta que o instagram_feed acima (100/24 h), mas
  # tem teto próprio porque é um post por vez e não deve competir com o feed de
  # oferta única. **Um carrossel de 6 ofertas conta como UM post** na cota — é
  # isso que torna o formato barato.
  # Este comando NÃO sai pelo `afiliado run`: quem o chama é o passo "Conteúdo
  # do feed" do publish.yml, UMA vez por dia (disparo das 08:00 BRT). O teto de
  # 1/dia é a rede — se o cron um dia se duplicar, `pacing_budget` +
  # `count_posts_today` barram o segundo carrossel.
  # A pesquisa (2026-08-28) recomenda 2-3 carrosséis por semana e a cadência
  # entregue é diária: a mesma pesquisa mede crescimento MONOTÔNICO com a
  # frequência e nenhuma penalidade por volume. Para voltar aos 2-3, o lugar é
  # aqui (`max_per_day: 0` em dias alternados não existe — mude o cron).
  instagram_carrossel:
    enabled: true
    max_per_day: 1
  # Fase 5E: story publicado pela API oficial (media_type=STORIES, sem legenda
  # e sem sticker de link — a API não tem um). A cota de publicação da Meta é
  # COMPARTILHADA com o feed: 100 por 24 h; 2 + 6 usam 8.
  instagram_story:
    enabled: false
    max_per_day: 60           # DESLIGADO: quem publica story é o instagram_story_link abaixo
  # Fase 5F: story COM figurinha de link, pelo instagrapi (API PRIVADA). Existe
  # porque a Graph API NEGA figurinhas e o Meta Business Suite só põe link em
  # story do Facebook — ver docs/superpowers/reviews/2026-08-27-sticker-de-link.md.
  #
  # REGRA DE OURO: este canal e o `instagram_story` acima NUNCA ficam ligados ao
  # mesmo tempo. Publicar pela API privada e pela oficial na MESMA conta, no
  # mesmo dia, é o padrão que chama atenção — o `doctor` reclama se os dois
  # estiverem `enabled: true`. O de cima é o fallback: se este desarmar, ligue
  # aquele e desligue este.
  #
  # E ele NÃO roda no GitHub Actions nem na VPS: só no `afiliado stories`, na
  # máquina do dono (IP residencial, sessão e device estáveis). O `afiliado run`
  # ignora este canal com aviso, mesmo ligado.
  instagram_story_link:
    enabled: true           # o dono liga depois de rodar `afiliado ig-login`
    # 60/dia = um a cada ~15 min na janela de 08:00-23:15. Cabe na cota da
    # Meta (100/24h, compartilhada com o feed), mas este canal é API PRIVADA:
    # volume alto é justamente o que atrai verificação de segurança, e o ativo
    # em risco é a conta. Escolha consciente do dono em 2026-08-27, ciente
    # disso. Se aparecer `challenge_required`, o primeiro número a baixar é
    # este.
    max_per_day: 60
    max_sem_link: 2          # falhas de verificação SEGUIDAS antes de desarmar o canal
    # session_path: data/ig_session.json   # padrão; está no .gitignore

# Fase 1.8: chat de operações só recebe resumo quando o run publicou,
# descartou ou gerou aviso — evita 192 mensagens/dia com a cadência de 5 min.
# Fase 5A: cada aviso entra UMA vez por dia local (tabela `warned`); o
# heartbeat da manhã ("Bom dia — ontem: ...") é um aviso e sempre chega. O
# caminho de exceção (run abortado/interrompido) sempre notifica.
# Seção opcional; ausente = false (comportamento desta fase).
ops:
  notify_empty_runs: false   # true = manda resumo mesmo quando nada aconteceu
