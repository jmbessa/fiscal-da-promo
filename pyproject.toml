[project]
name = "afiliado"
version = "0.1.0"
description = "Pipeline automático de divulgação de ofertas com link de afiliado"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Fase 5F: story COM figurinha de link (canal `instagram_story_link`). É API
# PRIVADA do Instagram — a Graph API nega figurinhas ("Story Limitations", ver
# docs/superpowers/reviews/2026-08-27-sticker-de-link.md). Fica fora das
# dependências obrigatórias de propósito: quem não instalar o extra continua
# com o pipeline inteiro funcionando (o import do instagrapi é preguiçoso,
# dentro da função), e a suíte roda numa máquina sem ele.
#   pip install -e .[stories]
stories = ["instagrapi>=2.18"]
# Fase 5P: a leitura do preço de CHECKOUT da Shopee no navegador
# (`afiliado.preco_real`). Opcional pelo mesmo motivo do `stories`, e com a
# mesma disciplina: o import é preguiçoso, quem não instalar tem o pipeline
# inteiro funcionando (a leitura se desarma com um aviso) e a suíte roda numa
# máquina sem ele.
#
# Playwright e não CDP contra o Chrome instalado: `launch_persistent_context`
# recebe o diretório do perfil como argumento obrigatório, e o perfil passa por
# `preco_real.perfil_proibido` antes — a guarda de "nunca o perfil logado do
# dono" vira código. Com CDP alguém teria de subir o Chrome à mão com
# `--user-data-dir`, e o erro de apontá-lo para o perfil do dono é justamente o
# que encerra o lado Shopee. Ver docs/runbooks/shopee-preco.md.
#
#   pip install -e .[preco] && playwright install chromium
# (com `browser_channel: chrome`, o padrão, o segundo comando é dispensável: ele
#  usa o Chrome que já está instalado, com um perfil vazio nosso.)
preco = ["playwright>=1.44"]
# Fase 5T: o REEL (`creative.render_reel` e o canal `instagram_reel`). Os
# frames são desenhados pelo Pillow que já está nas dependências obrigatórias;
# o que falta é EMPACOTÁ-LOS em H.264, e isso é ffmpeg. O `imageio-ffmpeg` é
# só o binário — ele não importa nada em tempo de execução do pipeline.
#
# Opcional pelo mesmo motivo do `stories` e do `preco`, e com a mesma
# disciplina: o import é preguiçoso, quem não instalar tem o pipeline inteiro
# funcionando (o canal não sobe e o run avisa uma vez) e a suíte roda numa
# máquina sem ele. Quem já tem um `ffmpeg` no PATH não precisa deste extra —
# `afiliado.video` usa o do PATH quando não acha o do extra.
#
#   pip install -e .[reel]
reel = ["imageio-ffmpeg>=0.5"]

[project.scripts]
afiliado = "afiliado.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
afiliado = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
