# Fase 1.8: a produção de alta cadência (a cada 5 min) roda via cron na VPS —
# ver docs/runbooks/vps-setup.md. O Actions NÃO acompanha essa cadência (cron
# do GitHub tem piso de 5 min, mas com atrasos típicos de 5–30 min, e custo de
# minutos muito acima da cota gratuita rodando 288x/dia). Este workflow é
# redundância/backup horário e disparo manual (workflow_dispatch), não a
# fonte principal de execuções.
name: publish
on:
  schedule:
    - cron: "0 11-23 * * *"   # 08h–20h BRT
    - cron: "0 0-2 * * *"     # 21h–23h BRT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run (não publica)"
        type: boolean
        default: false
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install -e .
      - name: Executar pipeline
        run: afiliado run ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
      - name: Commitar estado
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "afiliado-bot"
          git config user.email "afiliado-bot@users.noreply.github.com"
          git add data/state.db
          git diff --cached --quiet || git commit -m "chore: atualiza estado após run [skip ci]"
          git push
