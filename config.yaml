state:
  path: data/state.db

llm:
  model: haiku

# Fase 1.8: a cadência real de execução é definida pelo agendador externo
# (cron da VPS a cada 5 min, produção; ver docs/runbooks/vps-setup.md) — não
# há nada aqui que controle o intervalo entre runs.
selection:
  posts_per_run: 1
  min_discount_pct: 20
  price_min_brl: 20
  price_max_brl: 1000
  dedupe_days: 30
  # Fase 1.8: piso de valor esperado (comissão em R$ ponderada por popularidade,
  # via ev_score, SEM boost de watchlist) por post — com dedupe de 30 dias e
  # cadência de 5 min (288 checagens/dia), evita postar sobras quando o estoque
  # de boas ofertas esgota. 0 ou ausente desliga o piso (todas as ofertas que
  # passam os demais filtros seguem elegíveis).
  min_ev_brl: 0.50
  # Prioridade definida pela análise JoomPulse de 2026-08-23 (dados de jul/2026):
  # Beleza (100630, +12% m/m) e Casa (100636, maior volume) como núcleo;
  # Saúde (100001), Esportes (100637) e Mãe e Bebê (100632) como complemento.
  # Faixa de foco de impulso: R$25-150.
  # Fase 3: por fonte (dict) — a Shopee usa IDs numéricos e o ML usa IDs
  # "MLB...", então um allowlist único descartaria toda oferta de uma das
  # fontes. Lista simples (formato antigo) continua valendo para todas as
  # fontes; vazio/ausente = todas as categorias passam.
  category_ids:
    shopee: ["100630", "100636", "100001", "100637", "100632"]
    meli: []      # vazio: a busca do ML já é restrita por meli.category_ids
  # Pesos do score de valor esperado (fase 1.5): EV = comissão em R$ × (1 + popularity × log10(vendas+1))
  ev_weights:
    popularity: 0.3

# Fase 3 (parte 1): fontes de ofertas habilitadas. Seção opcional — ausente,
# equivale a só shopee (comportamento de antes desta fase). O Mercado Livre
# nasce DESLIGADO: ligar exige credenciais (ver README) e o pool de links de
# afiliado (data/meli_links.json, ver docs/runbooks/meli-setup.md).
sources:
  shopee: true
  meli: false

shopee:
  sort_types: [5]          # ordenações consultadas e mescladas; valores a confirmar no doctor (Task 14)
  list_type: 0
  pages: 3
  page_size: 50

# Fase 3 (parte 1): descoberta no Mercado Livre (autenticação em MeliSource).
# Geração de link de afiliado ainda não é automática — usa o pool pré-gerado
# em data/meli_links.json (ver docs/runbooks/meli-setup.md).
meli:
  category_ids: ["MLB1246", "MLB1574", "MLB1276", "MLB264586"]
  per_category: 50          # itens buscados por categoria (máx. 50 por página)
  min_sold: 5               # ignora itens sem tração

validation:
  # mercadolivre.com.br e mercadolivre.com precisam estar os dois: a checagem
  # casa host == d ou host.endswith("." + d), e um não cobre o outro.
  allowed_domains: ["shopee.com.br", "shope.ee",
                    "mercadolivre.com.br", "mercadolivre.com", "meli.la"]

copy:
  tone: "empolgado, direto, sem exageros enganosos, pt-BR"

# Identidade: nome e handle desenhados nas artes de story/feed (ver docs/brand-guidelines.md).
brand:
  name: "Fiscal da Promo"
  handle: "@ofiscaldapromo"

# Fase 1.6: artefato semanal gerado por análise externa (boosts de EV + selo de menor preço).
# Opcional — ausente ou vencido, o pipeline degrada para o comportamento sem watchlist.
watchlist:
  path: data/watchlist.json

# Variante da API do Instagram usada por `instagram_feed` e pelo doctor:
#   instagram_login — "API do Instagram com Login do Instagram": token gerado no painel
#                     da Meta, sem Página do Facebook (padrão; ver docs/runbooks/meta-setup.md)
#   facebook_login  — conta business vinculada a Página; token via Graph API Explorer
instagram:
  api: facebook_login

# Fase 2A/1.7: canais habilitados. Seção opcional — ausente, equivale a só
# telegram. Cada canal aceita bool (liga/desliga) ou dict com `enabled` e,
# opcionalmente, `max_per_day` (teto diário contado no SQLite, para não
# saturar canais de esforço manual ou com limites de API/audiência).
channels:
  telegram:
    enabled: true
    max_per_day: 100         # meta do canal: 50-100 ofertas/dia (teto real da operação)
  story_dispatch:
    enabled: true            # arte de story + link prontos no chat de operações
    max_per_day: 6           # artes de story que chegam ao seu chat por dia
  instagram_feed:
    enabled: true             # Variante B configurada em 2026-08-25 (token de Página permanente)
    max_per_day: 2

# Fase 1.8: chat de operações só recebe resumo quando o run publicou,
# descartou ou gerou aviso — evita 288 mensagens/dia com a cadência de 5 min.
# O caminho de exceção (run abortado) sempre notifica, independente disto.
# Seção opcional; ausente = false (comportamento desta fase).
ops:
  notify_empty_runs: false   # true = manda resumo mesmo quando nada aconteceu
